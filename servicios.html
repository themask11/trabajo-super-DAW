<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="author" content="Vicente Leiva">
    <meta name="description" content="Guardería canina para diversas mascotas, con el fin de darles la mejor atención">
    <meta name="keywords" content="guarderia canina temporal, hotel mascotas santiago, cuidado de perros chile, veterinaria escolar, animales, cuidados">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Guarderia Pelusa - Servicios</title>
</head>

<body>
    <header>
        <nav>
            <ul class="lista_cabeza">
                <li><a href="index.html">Menu</a></li>
                <li><a href="nosotros.html">nosotros</a></li>
                <li><a href="servicios.html">servicios</a></li>
                <li><a href="contacto.html">contacto</a></li>
                <li><a href="finanzas.html">finanzas</a></li>
            </ul>
        </nav>
    </header>

    <div class="title">
        <h1>Servicios</h1>
    </div>

    <main class="contenido-servicios">
        <div class="card-formulario">
            <h2>Ingreso de mascota</h2>
            <form id="form-mascota">
                <div class="campo-grupo">
                    <label for="nombre">Nombre mascota</label>
                    <input type="text" id="nombre" name="nombre_mascota" placeholder="Nombre de Mascota" required>
                </div>

                <div class="campo-grupo">
                    <label for="peso">Ingrese el peso de la mascota (kg)</label>
                    <input type="number" id="peso" name="peso_mascota" placeholder="0" min="1" step="1" required>
                </div>

                <div class="campo-grupo">
                    <label for="estadia">Horas de estadía (máximo 5 hrs)</label>
                    <input type="number" id="estadia" name="horas_estadia" placeholder="1" min="1" required>
                </div>

                <div class="campo-grupo">
                    <label for="coste">Coste por hora</label>
                    <input type="text" id="coste" name="coste_hora" value="$1000 por hora" readonly>
                </div>

                <div class="boton-contenedor">
                    <button type="submit" class="btn-confirmar">Confirmar</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>la mejor guardería canina del país</p>
    </footer>

    <script src="JS/script.js"></script>
</body>

</html>
